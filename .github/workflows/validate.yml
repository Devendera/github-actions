name: Validate files
on: push
jobs:
    validate-file:
      runs-on: ubuntu-latest
      
      steps:
        - name: get-repo-code
          uses: actions/checkout@v4

        - name: Setup Node.js 24
          uses: actions/setup-node@v4
          with:
            node-version: 24

        - name: Install HTML validator
          run: npm install --global html-validate
        
        - name: Validate HTML file
          run: html-validate .github/workflows/index.html

        - name: Validate JavaScript file
          run: node --check .github/workflows/script.js